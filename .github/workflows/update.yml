name: Aggiorna archivi SuperEnalotto + VinciCasa

on:
  workflow_dispatch:
  push:
    paths:
      - 'update_draws.py'
      - '.github/workflows/update.yml'
  schedule:
    - cron: '0 */3 * * *'

permissions:
  contents: write

concurrency:
  group: update-archives
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Aggiorna archivi e ricalcola il modello
        run: python update_draws.py
      - name: Commit se ci sono nuove estrazioni
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/draws.json data/vincicasa.json
          if git diff --cached --quiet; then
            echo 'Nessuna modifica da salvare.'
          else
            git commit -m 'chore: aggiorna estrazioni'
            git push
          fi

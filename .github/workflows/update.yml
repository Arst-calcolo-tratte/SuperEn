name: Aggiorna archivi SuperEnalotto + VinciCasa
on:
  workflow_dispatch:
  schedule:
    - cron: '0 */3 * * *'
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.x'}
      - run: python update_draws.py
      - name: Commit se ci sono nuove estrazioni
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/draws.json data/vincicasa.json
          git diff --cached --quiet || git commit -m 'chore: aggiorna estrazioni'
          git push || true
